<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Node - Detail View</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="south-page">
  <div class="container detail-container">
    <a href="south_node.html" class="back-link">← Back to South Node</a>

    <div class="detail-view">
      <div class="detail-image-container">
        <img id="detailImage" src="" alt="" class="detail-image">
      </div>

      <div class="detail-content">
        <h1 id="detailTitle" class="detail-title"></h1>
        <p id="detailDescription" class="detail-description"></p>
        <span id="detailCategory" class="detail-category"></span>
      </div>
    </div>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const imageSrc = urlParams.get('image');
    const title = urlParams.get('title');
    const description = urlParams.get('desc');
    const category = urlParams.get('category');

    // Populate the page
    if (imageSrc && title && description) {
      document.getElementById('detailImage').src = imageSrc;
      document.getElementById('detailImage').alt = title;
      document.getElementById('detailTitle').textContent = title;
      document.getElementById('detailDescription').textContent = description;
      if (category) {
        document.getElementById('detailCategory').textContent = category;
      }
      document.title = `${title} - South Node`;
    } else {
      // Redirect back if no parameters
      window.location.href = 'south_node.html';
    }
  </script>
</body>
</html>
